# Cargo.toml

[package]
name = "paytm_checksum"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Paytm checksum generation and verification library"

[lib]
name = "paytm_checksum"
path = "src/lib.rs"

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
cipher = "0.4.4"
base64 = "0.22"
sha2 = "0.10.9"
rand = "0.9.4"